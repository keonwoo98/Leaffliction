[project]
name = "leaffliction"
version = "1.0.0"
description = "42 Leaffliction — leaf disease image classification"
requires-python = ">=3.11"
dependencies = [
    "torch>=2.2",
    "torchvision>=0.17",
    "albumentations>=1.4",
    "plantcv>=4.0",
    "pillow",
    "opencv-python",
    "matplotlib",
    "seaborn",
    "numpy",
    "scikit-learn",
    "typer>=0.12",
    "rich",
]

[dependency-groups]
dev = ["ruff", "flake8", "flake8-pyproject>=1.2", "pytest", "pytest-cov", "pre-commit"]

[tool.hatch.build.targets.wheel]
packages = ["src/leaffliction"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 99
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM"]
ignore = ["E501"]  # line length handled by formatter

[tool.flake8]
max-line-length = 99
extend-ignore = ["E203", "W503"]
exclude = [".venv", "build", "dist"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"
pythonpath = ["src"]
