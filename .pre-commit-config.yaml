repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.6.9
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: local
    hooks:
      - id: no-dataset
        name: Block dataset/model files
        entry: bash scripts/check_no_dataset.sh
        language: system
        always_run: true
        pass_filenames: false
